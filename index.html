<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конструктор сильных постов. Дарья Ковальчук</title>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@700&display=swap";document.head.appendChild(l);})();</script>
<style>
:root{--bg:#EDEFE9;--surface:#FAFBF8;--ink:#1F2A2E;--muted:#5E6A6D;--line:#D5D9D2;--btn:#1F2A2E;--btn-ink:#FAFBF8;--err:#B4432B;
 --h:#E2A64E;--o:#7FB29E;--b:#9C95D6;--c:#6FA8C8;--e:#E3866F;color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151A1C;--surface:#1E2528;--ink:#E7ECE8;--muted:#9AA6A8;--line:#313B3E;--btn:#E7ECE8;--btn-ink:#151A1C;--err:#F2957F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151A1C;--surface:#1E2528;--ink:#E7ECE8;--muted:#9AA6A8;--line:#313B3E;--btn:#E7ECE8;--btn-ink:#151A1C;--err:#F2957F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.stack{display:flex;flex-direction:column;gap:5px;width:96px;margin-bottom:22px}
.stack span{height:12px;border-radius:4px}
.stack span:nth-child(1){background:var(--h)}.stack span:nth-child(2){background:var(--o);width:80%}
.stack span:nth-child(3){background:var(--b);width:92%}.stack span:nth-child(4){background:var(--e);width:62%}
h1{font:700 clamp(22px,5vw,28px)/1.15 "Unbounded",system-ui,sans-serif;margin:0 0 8px}
.author{font-weight:600;margin:0 0 18px}
.author a{color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
p{margin:0 0 18px;color:var(--muted);font-size:15px}
label{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:none;border-color:var(--ink)}
button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.err{color:var(--err);font-size:14px;min-height:22px;margin-top:8px}
.help{font-size:14px;color:var(--muted);margin-top:14px}
.help a{color:var(--ink)}
</style>
</head>
<body>
<main class="card">
  <div class="stack" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <h1>Конструктор сильных постов</h1>
  <div class="author"><a href="https://t.me/darya_bizness" target="_blank" rel="noopener">Дарья Ковальчук, маркетолог для помогающих практиков. Телеграм-канал @darya_bizness</a></div>
  <p>Доступ для покупателей. Введите пароль из письма или сообщения после оплаты.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocapitalize="off" spellcheck="false" required>
    <button id="go" type="submit">Открыть конструктор</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="help">Нет пароля или он не подходит? Напишите Дарье в <a href="https://www.threads.com/@darya.strateg" target="_blank" rel="noopener">Threads</a> или в <a href="https://t.me/darya_bizness" target="_blank" rel="noopener">телеграм-канал</a>.</div>
</main>

async function derive(pw,salt,iter){
  const pb=new TextEncoder().encode(pw);
